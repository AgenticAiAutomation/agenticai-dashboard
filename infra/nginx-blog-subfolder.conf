# WordPress at agenticaiautomation.co/blog/*  (subfolder, NOT a subdomain)
#
# WordPress lives at /var/www/blog. This file is a set of location blocks meant
# to be INCLUDED inside the existing agenticaiautomation.co server block:
#
#   server {
#       server_name agenticaiautomation.co www.agenticaiautomation.co;
#       ...existing marketing-site config...
#       include /etc/nginx/snippets/blog-subfolder.conf;
#   }
#
# Install:
#   cp infra/nginx-blog-subfolder.conf /etc/nginx/snippets/blog-subfolder.conf
#   # add the include line above to the existing server block
#   nginx -t && systemctl reload nginx
#
# `root` is set inside each location so the outer server block's root (the
# marketing site) is left untouched: /blog/foo resolves to /var/www/blog/foo.

location /blog/ {
    root /var/www;
    index index.php;
    try_files $uri $uri/ /blog/index.php?$args;

    # WordPress rewrites its own permalinks; nothing else to do here.
}

# Bare /blog with no trailing slash.
location = /blog {
    return 301 /blog/;
}

location ~ ^/blog/.+\.php$ {
    root /var/www;

    include snippets/fastcgi-php.conf;
    # Match the PHP version actually installed — check with `php -v`.
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;

    # Media uploads and REST publishes can exceed the defaults.
    fastcgi_read_timeout 120s;
    client_max_body_size 32m;
}

# Static assets under wp-content / wp-includes are immutable per release.
location ~* ^/blog/wp-(content|includes)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    root /var/www;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# The dashboard authenticates to the REST API with an application password over
# Basic auth. Some PHP-FPM setups drop the Authorization header — this keeps it.
location = /blog/wp-json {
    return 301 /blog/wp-json/;
}

# --- Hardening -------------------------------------------------------------
# Block direct execution of anything uploaded into wp-content/uploads.
location ~* ^/blog/wp-content/uploads/.*\.(php|phtml|php[0-9])$ {
    deny all;
}

# xmlrpc.php is a brute-force and pingback amplification target; the dashboard
# uses the REST API, so nothing legitimate needs it.
location = /blog/xmlrpc.php {
    deny all;
    access_log off;
    log_not_found off;
}

# Never serve dotfiles, backups, or the WP config.
location ~ ^/blog/(\.|wp-config\.php|readme\.html|license\.txt) {
    deny all;
}
