# Frontend for dashboard.agenticaiautomation.co
# Serves the Next.js static export from /var/www/agenticai-dashboard/web/out
# Place at /etc/nginx/sites-available/dashboard-frontend and symlink into sites-enabled.
# Certbot appends the SSL server block + :80 redirect on first issuance.

server {
    server_name dashboard.agenticaiautomation.co;

    root /var/www/agenticai-dashboard/web/out;
    index index.html;

    # Build output is immutable and content-hashed.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # next.config.js sets trailingSlash: true, so /login is /login/index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dashboard.agenticaiautomation.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.agenticaiautomation.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = dashboard.agenticaiautomation.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dashboard.agenticaiautomation.co;
    return 404; # managed by Certbot


}