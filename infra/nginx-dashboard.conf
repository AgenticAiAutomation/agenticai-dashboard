# Nginx configuration for api.dashboard.agenticaiautomation.co
# Place in /etc/nginx/sites-available/dashboard
# Symlink to /etc/nginx/sites-enabled/dashboard

server {
    listen 80;
    server_name api.dashboard.agenticaiautomation.co;

    # Redirect HTTP to HTTPS (after certbot setup)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.dashboard.agenticaiautomation.co;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.dashboard.agenticaiautomation.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dashboard.agenticaiautomation.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers (if needed beyond FastAPI CORS)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    }

    # Healthcheck endpoint
    location /health {
        proxy_pass http://127.0.0.1:5003/health;
        access_log off;
    }
}
